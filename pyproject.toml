[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sachin-agent"
version = "0.1.0"
description = "Self-improving job application agent"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.5",
    "email-validator>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.1",
    "sqlmodel>=0.0.14",
    "typer>=0.12",
    "loguru>=0.7",
    "openai>=1.50",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
sachin-agent-scraper = "scraper.cli:app"
sachin-agent-matcher = "matcher.cli:app"
sachin-agent-applier = "applier.cli:app"
sachin-agent-db      = "shared.db.cli:app"
sachin-agent-profile = "shared.profile.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["shared", "scraper", "matcher", "applier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["shared", "scraper", "matcher", "applier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"